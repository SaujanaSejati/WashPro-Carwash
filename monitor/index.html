<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>WashPro | Paparan Nombor Giliran</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#102036;--line:#263c55;--text:#f2f7ff;--muted:#9db1c8;--blue:#45a3ff;--green:#42d6a0;--amber:#ffc66d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#173352 0,#07111f 62%);color:var(--text);font:clamp(16px,1.6vw,24px)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.screen{max-width:1600px;margin:auto;padding:clamp(16px,3vw,44px)}header{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{display:flex;gap:14px;align-items:center}.logo{display:grid;place-items:center;width:clamp(48px,5vw,76px);height:clamp(48px,5vw,76px);border-radius:20px;background:linear-gradient(135deg,#43b2ff,#41e0b0);color:#07111f;font-size:clamp(26px,3vw,42px);font-weight:900}.brand h1{font-size:clamp(24px,3vw,42px);margin:0}.brand p{margin:2px 0;color:var(--muted);font-size:clamp(12px,1.3vw,18px)}.clock{text-align:right;color:var(--muted);font-size:clamp(13px,1.4vw,20px)}.clock strong{display:block;color:var(--text);font-size:clamp(20px,2vw,30px)}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:clamp(16px,2vw,28px);margin-top:clamp(20px,3vw,42px)}.panel{background:rgba(16,32,54,.9);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,42px);min-width:0}.label{font-size:clamp(15px,1.6vw,23px);color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.current{min-height:42vh;display:flex;flex-direction:column;justify-content:center}.number{font-size:clamp(100px,22vw,280px);font-weight:950;letter-spacing:-.07em;line-height:1.05;color:var(--green);text-shadow:0 0 50px #42d6a022;overflow-wrap:anywhere}.detail{font-size:clamp(22px,3vw,42px);font-weight:800;margin-top:12px}.sub{color:var(--muted);font-size:clamp(14px,1.6vw,22px);margin-top:5px}.waiting-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.waiting-head h2{font-size:clamp(22px,2.4vw,34px);margin:0}.count{background:#223b54;border-radius:99px;padding:5px 12px;font-size:clamp(14px,1.3vw,18px)}.queue-list{display:grid;gap:10px}.queue-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(12px,1.5vw,20px);border-radius:16px;background:#0a192a;border:1px solid #213750}.queue-item{flex-direction:column;align-items:flex-start;gap:2px}.queue-item strong{font-size:clamp(30px,4vw,50px);color:var(--amber);line-height:1.1}.queue-item span{color:var(--text);text-align:left;font-size:clamp(17px,1.6vw,23px);font-weight:800}.queue-item span.package{color:var(--muted);font-size:clamp(12px,1.2vw,16px);font-weight:500}.empty{padding:32px 8px;color:var(--muted);text-align:center}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;color:var(--muted);font-size:clamp(12px,1.2vw,16px)}button{border:1px solid #3b5878;background:#18324c;color:var(--text);padding:10px 15px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.status{color:var(--green)}@media(max-width:800px){.grid{grid-template-columns:1fr}.current{min-height:30vh}.number{font-size:clamp(100px,28vw,190px)}header{align-items:flex-start}.clock{max-width:120px}}@media(min-width:1300px){.grid{grid-template-columns:1.25fr .75fr}}
</style>
</head>
<body><main class="screen">
<header><div class="brand"><div class="logo">W</div><div><h1>WashPro</h1><p>SISTEM NOMBOR GILIRAN CARWASH</p></div></div><div class="clock"><strong id="clock">--:--:--</strong><span id="date"></span></div></header>
<div class="grid">
<section class="panel current"><div class="label">Nombor sedang dipanggil</div><div id="currentNumber" class="number">—</div><div id="currentDetail" class="detail">Sila tunggu panggilan</div><div id="currentStatus" class="sub">Pelanggan akan dipanggil di sini</div></section>
<section class="panel"><div class="waiting-head"><h2>Giliran menunggu</h2><span id="waitingCount" class="count">0 pelanggan</span></div><div id="waitingList" class="queue-list"><div class="empty">Memuatkan giliran…</div></div></section>
</div>
<div class="footer"><span><span class="status">●</span> <span id="connection">Menyambung ke sistem…</span></span><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button id="soundButton" type="button">Aktifkan bunyi panggilan</button><span>WashPro · Paparan langsung</span></div></div>
</main>
<script>
const URL="https://wvxaiojnxwzcdrczbdup.supabase.co";
const KEY="sb_publishable_F_JX1g6axQQBZUJTVRCqUA_fEc5YsA2";

let soundEnabled=false,lastCalledId=null,lastSignature="",audioCtx=null;
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function label(n){return "Q"+String(n).padStart(3,"0")}
function beep(){if(!soundEnabled||!audioCtx||audioCtx.state!=="running")return;try{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.setValueAtTime(880,audioCtx.currentTime);osc.frequency.setValueAtTime(660,audioCtx.currentTime+.18);gain.gain.setValueAtTime(.001,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+.03);gain.gain.setValueAtTime(.001,audioCtx.currentTime+.42);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.45)}catch(e){}}
function render(rows){const active=rows.filter(q=>!["completed","cancelled"].includes(q.status));const current=active.find(q=>q.status==="called")||active.find(q=>q.status==="washing");if(current){$("currentNumber").textContent=label(current.queue_number);$("currentDetail").textContent=current.vehicle_plate||"Pelanggan WashPro";$("currentStatus").textContent=(current.status==="washing"?"Sedang dicuci":"Sila ke ruang cucian")+" · "+(current.package_name||"");if(current.status==="called"&&lastCalledId!==current.id){beep();lastCalledId=current.id}}else{$("currentNumber").textContent="—";$("currentDetail").textContent="Sila tunggu panggilan";$("currentStatus").textContent="Nombor seterusnya akan dipaparkan di sini";lastCalledId=null}
const waiting=active.filter(q=>q.status==="waiting");$("waitingCount").textContent=waiting.length+" pelanggan";const signature=rows.map(q=>q.id+q.status).join("|");if(signature!==lastSignature){lastSignature=signature}
const list=$("waitingList");list.innerHTML="";if(!waiting.length){list.innerHTML='<div class="empty">Tiada pelanggan sedang menunggu.<br>Terima kasih kerana memilih WashPro.</div>'}else{waiting.slice(0,7).forEach(q=>{const item=document.createElement("div");item.className="queue-item";const n=document.createElement("strong");n.textContent=label(q.queue_number);const detail=document.createElement("span");detail.textContent="No. Plat: "+(q.vehicle_plate||"Belum diisi");const pkg=document.createElement("span");pkg.className="package";pkg.textContent=q.package_name||"Cucian";item.append(n,detail,pkg);list.appendChild(item)})}}
async function load(){try{const endpoint=URL+"/rest/v1/washpro_queue?select=id,queue_number,booking_date,vehicle_plate,package_name,status,called_at,created_at&booking_date=eq."+today()+"&order=queue_number.asc";const response=await fetch(endpoint,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!response.ok){const detail=await response.text();throw new Error("HTTP "+response.status+" "+detail)}const data=await response.json();render(data||[]);$("connection").textContent="Disambungkan · dikemas kini setiap 5 saat"}catch(e){console.error("WashPro queue load:",e);$("connection").textContent="Sambungan gagal ("+(e.message||"ralat tidak diketahui")+"). Muat semula halaman.";$("waitingList").innerHTML='<div class="empty">Tidak dapat memuatkan giliran.<br>Semak sambungan dan cuba muat semula.</div>'}}
function tick(){const d=new Date();$("clock").textContent=d.toLocaleTimeString("ms-MY",{hour12:false});$("date").textContent=d.toLocaleDateString("ms-MY",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
$("soundButton").addEventListener("click",async()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C){$("connection").textContent="Pelayar ini tidak menyokong audio. Cuba buka di Safari/Chrome.";return}if(!audioCtx)audioCtx=new C();await audioCtx.resume();soundEnabled=true;$("soundButton").textContent="Bunyi aktif ✓ · Tekan untuk uji";beep();$("connection").textContent="Bunyi diaktifkan. Pastikan telefon/TV tidak mute."}catch(e){$("connection").textContent="Audio gagal diaktifkan. Cuba tekan sekali lagi dan naikkan volume."}});
tick();load();setInterval(tick,1000);setInterval(load,5000);
</script></body></html>
